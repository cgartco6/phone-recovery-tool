<!-- frontend/comprehensive-dashboard.html -->
<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-unlock"></i> Comprehensive Lock Removal</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Select Lock Types to Remove:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="frpCheck" checked>
                        <label class="form-check-label" for="frpCheck">FRP Lock (Google Account)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="kgCheck">
                        <label class="form-check-label" for="kgCheck">KG Lock (Samsung Knox)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="mdmCheck">
                        <label class="form-check-label" for="mdmCheck">MDM Lock (Enterprise)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="googleAccountCheck">
                        <label class="form-check-label" for="googleAccountCheck">Google Account</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="payjoyCheck">
                        <label class="form-check-label" for="payjoyCheck">PayJoy Lock</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="payatCheck">
                        <label class="form-check-label" for="payatCheck">Pay@ Lock</label>
                    </div>
                </div>
                <button id="startComprehensiveUnlock" class="btn btn-danger">
                    <i class="fas fa-bomb"></i> Remove All Selected Locks
                </button>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-microchip"></i> Manufacturer Intelligence</h5>
            </div>
            <div class="card-body">
                <div id="manufacturerAnalysis"></div>
                <div id="recommendedTools" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-tools"></i> Driver & Software Management</h5>
            </div>
            <div class="card-body">
                <button id="installAllDrivers" class="btn btn-info">
                    <i class="fas fa-download"></i> Install All Required Drivers
                </button>
                <button id="downloadTools" class="btn btn-warning">
                    <i class="fas fa-wrench"></i> Download Required Tools
                </button>
                <div id="driverSoftwareStatus" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
