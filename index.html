<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Recovery Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .device-card { transition: transform 0.2s; }
        .device-card:hover { transform: translateY(-5px); }
        .progress { height: 10px; }
        .task-status { padding: 10px; border-radius: 5px; }
        .status-completed { background-color: #d4edda; }
        .status-running { background-color: #fff3cd; }
        .status-failed { background-color: #f8d7da; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-mobile-alt"></i> Phone Recovery Toolkit
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Device Scanner -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-search"></i> Device Scanner</h5>
                    </div>
                    <div class="card-body">
                        <button id="scanDevices" class="btn btn-primary">
                            <i class="fas fa-sync"></i> Scan Connected Devices
                        </button>
                        <div id="deviceList" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recovery Tasks -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-tasks"></i> Recovery Tasks</h5>
                    </div>
                    <div class="card-body">
                        <div id="taskProgress"></div>
                        <div id="activeTasks" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Assistant -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-robot"></i> AI Recovery Assistant</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Describe the device issue:</label>
                            <textarea class="form-control" id="issueDescription" rows="3"></textarea>
                        </div>
                        <button id="analyzeIssue" class="btn btn-success">
                            <i class="fas fa-brain"></i> Analyze & Create Recovery Plan
                        </button>
                        <div id="aiAnalysis" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
